[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxink"
version = "0.1.0"
description = "Local meeting recorder + transcriber. Records mic and system audio, transcribes on-device in Spanish."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gerardo V." }]
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "click>=8.1.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
build = ["pyinstaller>=6.0"]

[project.scripts]
voxink = "voxink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxink"]

[tool.ruff]
line-length = 100
target-version = "py310"
